<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="feltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Inner Casino Felt Circle -->
  <circle cx="256" cy="256" r="190" fill="url(#feltGrad)" stroke="url(#goldGrad)" stroke-width="6" opacity="0.9"/>

  <!-- Crown on top of Spade -->
  <g transform="translate(196, 100) scale(0.6)" fill="url(#goldGrad)">
    <path d="M0,80 L40,10 L100,60 L160,10 L200,80 Z"/>
    <circle cx="0" cy="80" r="10"/>
    <circle cx="40" cy="10" r="12"/>
    <circle cx="100" cy="60" r="10"/>
    <circle cx="160" cy="10" r="12"/>
    <circle cx="200" cy="80" r="10"/>
  </g>

  <!-- Royal Spade Symbol -->
  <path d="M256 160 C256 160 148 276 148 340 C148 392 188 424 234 416 C238 416 242 400 246 384 L226 448 L286 448 L266 384 C270 400 274 416 278 416 C324 424 364 392 364 340 C364 276 256 160 256 160 Z" 
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Center Card Pip -->
  <circle cx="256" cy="320" r="22" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4"/>
  <text x="256" y="328" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f59e0b" text-anchor="middle">👑</text>
</svg>
