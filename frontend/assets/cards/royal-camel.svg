  <path d="M 0 112 Q 45 104 85 114 L 120 110 L 120 120 L 0 120 Z" fill="#dda15e" opacity="0.5"/>

  <!-- Royal Desert Camel Silhouette & Details -->
  <!-- Legs -->
  <!-- Back Left Leg -->
  <path d="M 38 80 L 35 108 L 33 115 L 37 115 L 39 108 L 43 82 Z" fill="#b45309"/>
  <!-- Front Left Leg -->
  <path d="M 75 80 L 78 108 L 76 115 L 80 115 L 82 108 L 80 82 Z" fill="#b45309"/>
  <!-- Back Right Leg -->
  <path d="M 44 80 L 42 108 L 40 115 L 44 115 L 46 108 L 48 82 Z" fill="#d97706"/>
  <!-- Front Right Leg -->
  <path d="M 68 80 L 70 108 L 68 115 L 72 115 L 74 108 L 72 82 Z" fill="#d97706"/>

  <!-- Camel Body & Hump -->
  <path d="M 33 65 Q 30 78 40 82 L 75 82 Q 85 78 82 68 Q 80 62 76 60 Q 65 44 56 46 Q 48 48 45 56 Q 38 58 33 65 Z" fill="#d97706"/>

  <!-- Neck and Head -->
  <path d="M 76 66 Q 84 56 86 42 Q 88 34 94 30 L 98 32 Q 99 37 94 40 L 92 48 Q 90 60 80 72 Z" fill="#d97706"/>
  <!-- Camel Ears & Eye -->
  <path d="M 91 29 Q 92 25 94 27 Z" fill="#92400e"/>
  <circle cx="94" cy="33" r="1.5" fill="#1e293b"/>

  <!-- Royal Saddle & Howdah (Jhool) -->
  <!-- Saddle Cloth (Jhool) with Royal Border -->
  <path d="M 44 60 Q 56 56 68 60 L 69 76 Q 56 80 43 76 Z" fill="#991b1b" stroke="#facc15" stroke-width="1.2"/>
  <!-- Gold Fringe / Tassels -->
  <g fill="#facc15">
    <circle cx="46" cy="77" r="1.2"/>
    <circle cx="51" cy="78" r="1.2"/>
    <circle cx="56" cy="78.5" r="1.2"/>
    <circle cx="61" cy="78" r="1.2"/>
    <circle cx="66" cy="77" r="1.2"/>
  </g>
  <!-- Central Medallion on Jhool -->
  <circle cx="56" cy="68" r="4.5" fill="#facc15" stroke="#b45309" stroke-width="0.8"/>
  <circle cx="56" cy="68" r="2" fill="#991b1b"/>

  <!-- Royal Canopy / Parasol Motif (Chhatri) -->
  <path d="M 46 45 Q 56 36 66 45 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
  <line x1="56" y1="45" x2="56" y2="56" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="56" cy="35" r="2" fill="#ca8a04"/>

  <!-- Decorative Neck Garland (Gorbandh) -->
  <path d="M 86 48 Q 88 56 84 62" fill="none" stroke="#facc15" stroke-width="1.4" stroke-dasharray="2,1.5"/>
