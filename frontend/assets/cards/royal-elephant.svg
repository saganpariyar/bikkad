<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Royal Caparisoned Elephant (Haathi) -->
  <!-- Legs -->
  <rect x="36" y="80" width="10" height="34" rx="3" fill="#475569"/>
  <rect x="52" y="80" width="10" height="34" rx="3" fill="#334155"/>
  <rect x="68" y="80" width="10" height="34" rx="3" fill="#475569"/>
  <rect x="82" y="80" width="10" height="34" rx="3" fill="#334155"/>

  <!-- Body -->
  <path d="M 28 66 Q 28 48 50 48 L 82 48 Q 98 48 98 68 L 98 84 L 32 84 Q 28 80 28 66 Z" fill="#475569"/>

  <!-- Head & Trunk -->
  <path d="M 80 48 Q 94 48 98 56 Q 106 62 104 74 L 100 90 Q 98 96 94 96 Q 90 96 92 90 L 96 74 Q 94 66 88 64 Z" fill="#475569"/>
  <!-- Tusk -->
  <path d="M 96 72 Q 106 72 108 66 Q 106 64 98 67 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- Ear with Painted Henna Swirls -->
  <path d="M 76 52 Q 88 52 86 70 Q 82 78 74 76 Q 70 66 76 52 Z" fill="#64748b" stroke="#facc15" stroke-width="0.8"/>
  <path d="M 78 58 Q 83 63 80 70" fill="none" stroke="#dc2626" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="88" cy="56" r="2" fill="#ffffff"/>
  <circle cx="88" cy="56" r="1.1" fill="#0f172a"/>

  <!-- Royal Decorative Headplate (Shringar) -->
  <path d="M 88 48 Q 98 50 96 60 L 92 60 Z" fill="#facc15"/>
  <circle cx="94" cy="53" r="1.2" fill="#dc2626"/>

  <!-- Embroidered Saddle Jhool (Rich Crimson & Gold) -->
  <path d="M 40 54 Q 60 52 80 54 L 78 76 Q 60 80 42 76 Z" fill="#991b1b" stroke="#facc15" stroke-width="1.2"/>
  <circle cx="60" cy="65" r="5" fill="#facc15"/>
  <circle cx="60" cy="65" r="2.5" fill="#1e3a8a"/>
  <!-- Gold Fringe -->
  <g fill="#facc15">
    <circle cx="45" cy="77" r="1.2"/>
    <circle cx="52" cy="78" r="1.2"/>
    <circle cx="60" cy="78.5" r="1.2"/>
    <circle cx="68" cy="78" r="1.2"/>
    <circle cx="75" cy="77" r="1.2"/>
  </g>

  <!-- Golden Ambari / Howdah Seat -->
  <path d="M 48 44 L 46 54 L 74 54 L 72 44 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
  <circle cx="60" cy="40" r="3" fill="#dc2626" stroke="#facc15" stroke-width="1"/>
</svg>
