<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 135" width="100%" height="100%">
  <!-- Royal Rajput Maharani Miniature Bust -->
  <!-- Background Radiant Halo -->
  <circle cx="50" cy="54" r="32" fill="#fbcfe8" opacity="0.25" stroke="#f472b6" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Ornate Odhani / Chunari (Traditional Rajasthani Royal Veil) -->
  <path d="M 18 42 Q 50 16 82 42 Q 88 78 80 135 L 20 135 Q 12 78 18 42 Z" fill="#991b1b"/>
  <!-- Gold Zari Border on Chunari -->
  <path d="M 22 45 Q 50 22 78 45 Q 84 80 76 135" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="4,1.5"/>
  <path d="M 22 45 Q 16 80 24 135" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="4,1.5"/>

  <!-- Delicate Female Face -->
  <ellipse cx="50" cy="68" rx="17" ry="20" fill="#fed7aa" stroke="#f97316" stroke-width="0.8"/>

  <!-- Traditional Rajasthani Borla (Round Forehead Jewel at Hairline) -->
  <circle cx="50" cy="47" r="4.2" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
  <circle cx="50" cy="47" r="2" fill="#dc2626"/>
  <!-- Borla Pearl Strings extending to ears -->
  <path d="M 50 47 Q 36 50 32 58" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="2,1"/>
  <path d="M 50 47 Q 64 50 68 58" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="2,1"/>

  <!-- Arching Graceful Eyebrows -->
  <path d="M 37 62 Q 43 59 48 63" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 63 62 Q 57 59 52 63" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Large Doe Eyes (Meenakshi Eyes with Long Lashes) -->
  <ellipse cx="42" cy="66" rx="5.2" ry="3.4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <circle cx="42" cy="66" r="2.2" fill="#1e293b"/>
  <circle cx="41" cy="65.2" r="0.8" fill="#ffffff"/>

  <ellipse cx="58" cy="66" rx="5.2" ry="3.4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <circle cx="58" cy="66" r="2.2" fill="#1e293b"/>
  <circle cx="57" cy="65.2" r="0.8" fill="#ffffff"/>

  <!-- Traditional Nath (Royal Nose Ring) -->
  <circle cx="53.5" cy="72" r="3.2" fill="none" stroke="#facc15" stroke-width="1"/>
  <circle cx="56.7" cy="72" r="0.8" fill="#dc2626"/>
  <!-- Chain from Nath to Ear -->
  <path d="M 54 72 Q 62 70 66 65" fill="none" stroke="#facc15" stroke-width="0.7" stroke-dasharray="1.5,1"/>

  <!-- Delicate Lips with Bindi -->
  <circle cx="50" cy="58" r="1.4" fill="#dc2626"/>
  <path d="M 46 79 Q 50 77 54 79 Q 50 82 46 79 Z" fill="#dc2626"/>

  <!-- Choli & Dupatta (Royal Saffron & Crimson) -->
  <path d="M 33 96 L 24 135 L 76 135 L 67 96 Z" fill="#c2410c"/>

  <!-- Aad / Hasli (Royal Rajasthani Gold Choker Necklace) -->
  <path d="M 36 98 Q 50 110 64 98" fill="none" stroke="#facc15" stroke-width="4.5"/>
  <path d="M 38 100 Q 50 112 62 100" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <g fill="#fef08a">
    <circle cx="42" cy="108" r="1.5"/>
    <circle cx="50" cy="112" r="1.8"/>
    <circle cx="58" cy="108" r="1.5"/>
  </g>
</svg>
